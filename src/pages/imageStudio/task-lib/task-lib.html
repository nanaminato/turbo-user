<div class="bg-theme text-theme w-100 h-100 d-flex flex-column">
  <header>
    <button nz-button class="m-2">
      @if(menuVisible()){
        <nz-icon nzType="menu-fold" nzTheme="outline" (click)="toggleMenu()"/>
      }@else{
        <nz-icon nzType="menu-unfold" nzTheme="outline" (click)="toggleMenu()" />
      }
    </button>
  </header>
  <div class="w-100 d-flex flex-row-reverse">
    <button nz-button class="m-3 rounded-3" (click)="loadGenerateTasks()" >
      {{'universal.reload'|translate}}
    </button>
    <button nz-button class="m-3 rounded-3" (click)="stopAllTask()" >
      {{'image.stopAllTasks'|translate}}
    </button>
    <div class="m-3 rounded-3">
      <label class="me-1" [nz-tooltip]="'在http环境下,访问图片可能会被拒绝。使用代理模式来可避免。'">代理</label>
      <nz-switch  [(ngModel)]="useProxy" (ngModelChange)="changeProxySetting()"></nz-switch>
    </div>
  </div>
  <nz-card class="rounded-3 tasks m-2 overflow-auto">
    @for(task of generateTasks; track task){
      <nz-card class="my-1">
        <app-task-item [task]="task" [useProxy]="useProxy" [index]="$index" (delete)="awareDeleteItem($event)"></app-task-item>
      </nz-card>
    }
  </nz-card>

</div>
