<div class="d-flex flex-row w-100 h-100">
  <ng-template #studios>
    <div class="w-100 d-flex flex-column">
      <button nz-button class="rounded-2 bg-light text-dark mx-2 my-1 d-flex flex-row" routerLink="/chat"><img height="25" width="25" src="assets/icon/aichat_11zon.jpg">{{'universal.aiChat' | translate}}</button>
      <button nz-button class="rounded-2 bg-light text-dark mx-2 my-1 d-flex flex-row" routerLink="/image-studio"><img height="25" width="25" src="assets/icon/aipainting_11zon.jpg">{{'universal.aiPainting' | translate}}</button>
      <button nz-button class="rounded-2 bg-light text-dark mx-2 my-1 d-flex flex-row" routerLink="/media-studio"><span nz-icon nzType="node-index" nzTheme="outline"></span>{{ 'universal.mediaStudio' | translate }}</button>
    </div>
  </ng-template>
  @if(visible()){
    <div class="d-flex flex-column w-100 h-100 menu"
    >
      <div class="bg-theme overflow-y-scroll scrollbar-y-none flex-grow-1">
        <div class="d-flex flex-row justify-content-start pt-3 px-3 align-items-center">
          <span nz-icon nzType="node-index" nzTheme="outline"></span>
          <div>{{ 'universal.mediaStudio' | translate }}</div>
        </div>

        <div class="d-flex flex-column p-3">
          <button class="m-2 rounded-2" nz-button routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" [routerLink]="['/media-studio/openai-text-to-speech']">{{ 'mediaStudio.textToSpeech' | translate }}</button>
          <button class="m-2 rounded-2" nz-button routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" [routerLink]="['/media-studio/openai-speech-to-text']">{{ 'mediaStudio.speechToText' | translate }}</button>
          <button class="m-2 rounded-2" nz-button routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" [routerLink]="['/media-studio/media-extractor']">{{ 'mediaStudio.fileExtractor' | translate }}</button>
        </div>
      </div>
      <div class="bg-theme sticky-bottom z-0">
        <ng-container *ngTemplateOutlet="studios"></ng-container>
        @defer (on viewport) {
          <app-account-label></app-account-label>
        } @placeholder {
          <nz-skeleton></nz-skeleton>
        }
      </div>
    </div>
  }
  <div style="flex: 1 1 auto; overflow: hidden;">
    <router-outlet id="main-content"></router-outlet>
  </div>
</div>
