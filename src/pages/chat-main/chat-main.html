<!-- 简化后的 chat-main 模板：
     - 移除 ballHelper（浮动的管理/添加系统信息按钮）
     - 移除 miniHead 顶部条（含模型选择/编辑/紧凑操作行）
     - 移除系统信息相关的模态（添加系统信息、管理系统上下文）
     - 保留编辑消息模态（用于编辑对话中的某条消息）
     - 保留菜单切换按钮、logo、对话列表与底部输入区
     - 模型选择移到输入框上方 -->
@defer (on immediate) {
  <nz-modal [(nzVisible)]="isVisible" [nzTitle]="'chat-main.edit' | translate"
            (nzOnCancel)="handleCancel()" (nzOnOk)="handleOk()">
    <ng-container *nzModalContent>
      <app-model-editor [chatModel]="editModel"></app-model-editor>
    </ng-container>
  </nz-modal>
} @placeholder {
  <div></div>
}

<div class="chat-main w-100 h-100 bg-theme2 text-theme2">
  <!-- 顶部菜单切换按钮（独立、低 z-index，不放在 sticky-top 容器中） -->
  <div class="chat-topbar px-2 py-2">
    <button nz-button class="bg-theme2 text-theme2 border-0" type="button" (click)="toggleMenu()"
            [attr.aria-label]="menuVisible() ? 'Close navigation' : 'Open navigation'">
      @if(menuVisible()){
        <nz-icon nzType="menu-fold" nzTheme="outline" />
      }@else{
        <nz-icon nzType="menu-unfold" nzTheme="outline" />
      }
    </button>
  </div>
  <div class="chat-messages" #chatPanel>
    @if (showLogo()) {
      <ng-container *ngTemplateOutlet="logo"></ng-container>
    } @else {
      <div class="d-flex flex-column flex-grow-1">
        @for (chat of chatModels; track chat.dataId) {
          <app-dialogue
            (reGenerateSignal)="reGenerateHandle($event)"
            (userTask)="handleUserTask($event)" [chatModel]="chat" [content]="chat.content"
            [active]="isActive(chat!)"></app-dialogue>
        }
      </div>
    }
  </div>
  <!--  对话页面下部分的组件， 包含输入框等-->
  <div class="composer-shell">
    <div class="center-input rounded-2">
      <!-- 模型选择：移到输入框上方（按 ChatGPT 风格） -->
      <div class="model-row d-flex justify-content-center px-2">
        @defer (on immediate) {
          <app-model-selector></app-model-selector>
        } @placeholder (minimum 100ms){
          <select></select>
        }
      </div>
      <div class="composer-toolbar">
        <div class="select-box rounded-4">
          <nz-upload class="flex-grow-0 rounded-2"
                     [nzMultiple]="true"
                     [(nzFileList)]="fileList"
                     [nzBeforeUpload]="beforeUpload">
            <button nz-button class="bg-theme2 text-theme2">
              <span nz-icon nzType="upload"></span>
              {{'chat-main.selectFile' | translate}}
            </button>
          </nz-upload>
        </div>
        <div class="composer-tools">
          <button type="button" class="text-theme2 border-1 border-theme2 bg-theme2 rounded-2"
                  (click)="clearContext()"
                  nz-tooltip [nzTooltipTitle]="'chat-main.clearContext' | translate ">
            <img src="assets/svgs/clear.svg" width="30" height="20" [alt]="'chat-main.clear' | translate ">
          </button>
          <button type="button" class="text-theme2 border-1 border-theme2 bg-theme2 rounded-2"
                  (click)="insertInlineCodeFlags()"
                  nz-tooltip [nzTooltipTitle]="'chat-main.insertInlineCode' | translate">
            <span nz-icon nzType="italic" nzTheme="outline"></span>
          </button>
          <button type="button" class="text-theme2 border-1 border-theme2 bg-theme2 rounded-2"
                  (click)="insertCodeFlags()"
                  nz-tooltip [nzTooltipTitle]="'chat-main.insertCodeBlock' | translate">
            <span nz-icon nzType="code" nzTheme="outline"></span>
          </button>
        </div>
      </div>
      <div class="prompt-row p-1 m-2 rounded-2">
          <textarea nz-input
                    #promptBox
                    [placeholder]="'chat-main.askChatGPT' | translate "
                    [nzAutosize]="{minRows: 2,maxRows: 6}"
                    [(ngModel)]="inputText"
                    (keydown)="handlePromptKeydown($event)"
                    class="flex-grow-1 text-theme ask-box bg-transparent"></textarea>
        <div class="d-flex flex-column-reverse">
          <button nz-button type="button" class="rounded-5 bg-dark send-button"
                  [nzSize]="'small'"
                  [class.bg-opacity-10]="isFade()"
                  nz-tooltip [nzTooltipTitle]="miniPhone()? '': 'chat-main.ctrlEnterShortcut' | translate "
                  (click)="buttonControlGPT()"
                  [disabled]="!enableTouch()">
            @if(answering){
              <span class="text-white dark:text-black" nz-icon nzType="pause-circle"
                    nzTheme="outline"></span>
            }@else{
              <span data-state="closed"><svg width="24" height="24" viewBox="0 0 24 24"
                                             class="text-white dark:text-black"><path
                d="M7 11L12 6L17 11M12 18V7" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round"></path></svg></span>
            }
          </button>
        </div>
      </div>
    </div>
  </div>
  <div class="notice-row">
    <div class="center fs-mini overflow-hidden">
      {{'chat-main.potentialErrorNotice' | translate}}
    </div>
  </div>
</div>
