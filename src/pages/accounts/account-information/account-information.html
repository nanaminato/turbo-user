<nz-card class="super-b overflow-y-scroll h-100 w-100">
  <div class="d-flex flex-row-reverse">
    <button class="btn btn-primary"
      (click)="logout()">
      {{ 'account.signOut' | translate }}
    </button>
  </div>
  <div class="m-1 fs-u">
    {{ 'account.username' | translate }}: {{user?.name}}
  </div>
  <div class="m-1 fs-u">
    {{ 'account.nickname' | translate }}: {{user?.nickname===undefined ? ('universal.none' | translate) : user?.nickname}}
  </div>
  <div class="m-1 fs-u">
    {{ 'account.roles' | translate }}:
    @if(user!==undefined){
      @for(role of roles!;track role.roleId){
        {{role.name}}
      }
    }
  </div>
</nz-card>
